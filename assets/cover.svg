<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="0.55" stop-color="#0d1428"/>
      <stop offset="1" stop-color="#101a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="950" cy="320" r="430" fill="url(#glow)"/>

  <!-- faint dots -->
  <g fill="#243152" fill-opacity="0.6">
    <circle cx="120" cy="110" r="2"/><circle cx="200" cy="160" r="2"/><circle cx="90" cy="520" r="2"/>
    <circle cx="300" cy="560" r="2"/><circle cx="60" cy="300" r="2"/><circle cx="430" cy="90" r="2"/>
  </g>

  <!-- ===== AGENT NETWORK ===== -->
  <g transform="translate(958,300)">
    <!-- connecting lines from 5 agents to hub -->
    <g stroke="#4f46e5" stroke-opacity="0.45" stroke-width="2">
      <line x1="-150" y1="-150" x2="0" y2="0"/>
      <line x1="170" y1="-120" x2="0" y2="0"/>
      <line x1="-185" y1="40" x2="0" y2="0"/>
      <line x1="190" y1="60" x2="0" y2="0"/>
      <line x1="-40" y1="185" x2="0" y2="0"/>
    </g>

    <!-- agent nodes (label + dot) -->
    <g font-size="13" font-weight="bold" text-anchor="middle">
      <!-- Financial -->
      <circle cx="-150" cy="-150" r="30" fill="#101a36" stroke="#22c55e" stroke-width="2"/>
      <text x="-150" y="-146" fill="#86efac">FIN</text>
      <!-- Compliance -->
      <circle cx="170" cy="-120" r="30" fill="#101a36" stroke="#38bdf8" stroke-width="2"/>
      <text x="170" y="-116" fill="#7dd3fc">CMP</text>
      <!-- Operational -->
      <circle cx="-185" cy="40" r="30" fill="#101a36" stroke="#f59e0b" stroke-width="2"/>
      <text x="-185" y="44" fill="#fcd34d">OPS</text>
      <!-- Reputation -->
      <circle cx="190" cy="60" r="30" fill="#101a36" stroke="#ec4899" stroke-width="2"/>
      <text x="190" y="64" fill="#f9a8d4">REP</text>
      <!-- Strategic -->
      <circle cx="-40" cy="185" r="30" fill="#101a36" stroke="#a78bfa" stroke-width="2"/>
      <text x="-40" y="189" fill="#c4b5fd">STR</text>
    </g>

    <!-- central meta hub -->
    <circle r="58" fill="url(#hub)"/>
    <circle r="58" fill="none" stroke="#c7d2fe" stroke-opacity="0.6" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">META</text>
    <text x="0" y="18" text-anchor="middle" font-size="11" fill="#e0e7ff">SYNTHESIS</text>
  </g>

  <!-- verdict chip -->
  <g transform="translate(958,558)">
    <rect x="-92" y="-26" width="184" height="52" rx="14" fill="#0b1424" stroke="#22c55e" stroke-opacity="0.55"/>
    <circle cx="-66" cy="0" r="7" fill="#22c55e"/>
    <text x="-50" y="6" font-size="20" font-weight="bold" fill="#86efac">APPROVE</text>
    <text x="58" y="5" font-size="12" fill="#64748b">94%</text>
  </g>

  <!-- ===== LEFT TEXT ===== -->
  <!-- shield glyph -->
  <g transform="translate(96,150)">
    <path d="M0 -16 L14 -9 V3 C14 13 7 18 0 21 C-7 18 -14 13 -14 3 V-9 Z"
          fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <path d="M-6 1 L-1 7 L8 -5" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="124" y="156" font-size="15" font-weight="bold" letter-spacing="3" fill="#818cf8">AI VENDOR DUE DILIGENCE</text>

  <text x="92" y="290" font-size="92" font-weight="bold" fill="url(#title)">VendorIQ</text>

  <text x="96" y="346" font-size="29" fill="#cbd5e1">Multi-Agent Vendor Risk Platform</text>

  <line x1="98" y1="384" x2="360" y2="384" stroke="#334155"/>

  <text x="96" y="430" font-size="18" fill="#94a3b8">Five expert agents. One auditable decision.</text>

  <!-- tech pills -->
  <g font-size="16" font-weight="bold">
    <g transform="translate(96,470)">
      <rect width="160" height="38" rx="19" fill="#161f3a" stroke="#2d3b66"/>
      <text x="80" y="25" text-anchor="middle" fill="#cbd5e1">IBM watsonx</text>
    </g>
    <g transform="translate(268,470)">
      <rect width="118" height="38" rx="19" fill="#161f3a" stroke="#2d3b66"/>
      <text x="59" y="25" text-anchor="middle" fill="#cbd5e1">LangChain</text>
    </g>
    <g transform="translate(398,470)">
      <rect width="92" height="38" rx="19" fill="#161f3a" stroke="#2d3b66"/>
      <text x="46" y="25" text-anchor="middle" fill="#cbd5e1">Python</text>
    </g>
  </g>
</svg>
